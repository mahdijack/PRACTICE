<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dark Mode Test</title>

    <link rel="stylesheet" href="/src/style.css">
</head>

<body class="flex justify-center flex-wrap">

    <div class="p-6 mt-6 w-fit bg-red-300 text-center rounded-2xl shadow-lg">
        <div>
            <h1 class="font-bold text-4xl">Sign up</h1>
        </div>
        <div class="w-auto h-auto group">
            <form class="leading-10 mt-3">
                <label for="fname">Name : <br></label><input
                    class="text-center text-white border-2 rounded-3xl border-white leading-7 " id="fname" type="text">
                <br>
                <label for="fnum">Number : <br></label><input
                    class="text-center text-white border-2 rounded-3xl border-white leading-7 " id="fnum" type="text">
            </form>
            <button class="rounded-2xl border-2 border-white mt-3 w-45 leading-10
           hover:text-white hover:bg-gray-800 transition duration-300" onclick="CheckForm()" type="button">
                Sign up
            </button>
        </div>
    </div>


    <script src="/Javascripts/index.js"></script>

</body>

</html>
